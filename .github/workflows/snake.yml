name: Snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sami-mag07
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#1C1F24
            dist/snake-dark.svg?palette=github-dark&color_snake=#8FF05A

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
